<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Concentric dimensional chat icon</title>
<desc id="desc">A layered cyan and blue chat target with visible extruded sidewalls and beveled concentric rings.</desc>
<defs>
  <linearGradient id="outerTop" x1="0" y1="0" x2=".25" y2="1">
    <stop offset="0" stop-color="#08e9ed"/><stop offset=".48" stop-color="#04c7f0"/><stop offset="1" stop-color="#0799ed"/>
  </linearGradient>
  <linearGradient id="outerWall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#164f82"/><stop offset=".22" stop-color="#07518a"/><stop offset=".56" stop-color="#086b70"/><stop offset="1" stop-color="#075c76"/>
  </linearGradient>
  <linearGradient id="tailWall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#174879"/><stop offset="1" stop-color="#0a3e70"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0" stop-color="#0876d9"/><stop offset=".55" stop-color="#087de9"/><stop offset="1" stop-color="#0873df"/>
  </linearGradient>
  <linearGradient id="blueWall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0757a4"/><stop offset="1" stop-color="#073b72"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#00d9c4"/><stop offset=".52" stop-color="#00cbb5"/><stop offset="1" stop-color="#00b6a8"/>
  </linearGradient>
  <linearGradient id="tealWall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#087f85"/><stop offset="1" stop-color="#00645f"/>
  </linearGradient>
  <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#08a9d8"/><stop offset="1" stop-color="#0870df"/>
  </linearGradient>
  <linearGradient id="bubble" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#03dce6"/><stop offset="1" stop-color="#0798ef"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7affff" stop-opacity=".45"/><stop offset="1" stop-color="#00e9ff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Main extruded body: the translated silhouette forms the continuous sidewall. -->
<path d="M512 230 C674 230 807 345 807 488 C807 631 679 746 520 746 C474 746 431 735 393 717 L272 758 Q253 765 259 744 L284 665 C243 618 218 558 218 493 C218 348 350 230 512 230 Z"
      transform="translate(0 47)" fill="url(#outerWall)"/>
<!-- Tail's front-facing vertical wall, kept darker than the round body. -->
<path d="M284 665 L272 758 Q253 765 259 744 L284 665Z" transform="translate(0 0)" fill="#075087"/>
<path d="M272 758 Q253 765 259 744 L284 665 L284 712 L259 791 Q255 800 269 794 L373 760 L373 715Z"
      fill="url(#tailWall)"/>
<!-- Top face -->
<path d="M512 230 C674 230 807 345 807 488 C807 631 679 746 520 746 C474 746 431 735 393 717 L272 758 Q253 765 259 744 L284 665 C243 618 218 558 218 493 C218 348 350 230 512 230 Z"
      fill="url(#outerTop)"/>
<path d="M512 234 C670 234 802 347 802 488" fill="none" stroke="#58ffff" stroke-width="5" opacity=".48"/>

<!-- Outer blue ring sidewall and top -->
<path d="M512 269 C645 269 749 365 749 486 C749 607 644 704 520 704 C475 704 433 692 397 672 L319 698 L338 633 C300 593 275 540 275 486 C275 366 381 269 512 269 Z"
      transform="translate(0 24)" fill="url(#blueWall)"/>
<path d="M512 269 C645 269 749 365 749 486 C749 607 644 704 520 704 C475 704 433 692 397 672 L319 698 L338 633 C300 593 275 540 275 486 C275 366 381 269 512 269 Z"
      fill="url(#blue)"/>

<!-- Teal ring: visible dark extrusion below its lower arc -->
<path d="M512 293 C610 293 689 371 689 467 C689 563 610 641 512 641 C414 641 335 563 335 467 C335 371 414 293 512 293 Z"
      transform="translate(0 24)" fill="url(#tealWall)"/>
<path d="M512 293 C610 293 689 371 689 467 C689 563 610 641 512 641 C414 641 335 563 335 467 C335 371 414 293 512 293 Z"
      fill="url(#teal)"/>
<path d="M512 293 C610 293 689 371 689 467 C689 563 610 641 512 641 C414 641 335 563 335 467 C335 371 414 293 512 293 Z"
      fill="none" stroke="#52f6df" stroke-width="5" opacity=".62"/>

<!-- Inner blue ring and its lower sidewall -->
<path d="M512 374 C578 374 632 424 632 485 C632 547 578 596 512 596 C446 596 392 547 392 485 C392 424 446 374 512 374 Z"
      transform="translate(0 13)" fill="#0752ad"/>
<path d="M512 374 C578 374 632 424 632 485 C632 547 578 596 512 596 C446 596 392 547 392 485 C392 424 446 374 512 374 Z"
      fill="url(#blue)"/>
<path d="M512 399 C565 399 608 438 608 486 C608 535 565 574 512 574 C459 574 416 535 416 486 C416 438 459 399 512 399 Z"
      fill="url(#inner)"/>

<!-- Central speech mark, with clearly visible extruded underside -->
<path d="M512 432 C544 432 570 455 570 484 C570 514 545 537 512 537 C503 537 495 535 488 532 L462 545 Q451 550 455 538 L462 515 C456 506 453 496 453 484 C453 455 479 432 512 432 Z"
      transform="translate(0 17)" fill="#0750ae"/>
<path d="M512 432 C544 432 570 455 570 484 C570 514 545 537 512 537 C503 537 495 535 488 532 L462 545 Q451 550 455 538 L462 515 C456 506 453 496 453 484 C453 455 479 432 512 432 Z"
      fill="url(#bubble)"/>
<path d="M512 432 C544 432 570 455 570 484 C570 514 545 537 512 537 C503 537 495 535 488 532 L462 545 Q451 550 455 538 L462 515 C456 506 453 496 453 484 C453 455 479 432 512 432 Z"
      fill="none" stroke="#51ffff" stroke-width="3" opacity=".55"/>
</svg>