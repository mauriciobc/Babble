<marker id="side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/></marker>
<symbol id="lock" viewBox="0 0 12 14"><path d="M3 6V4a3 3 0 0 1 6 0v2" fill="none" stroke="#1f2328" stroke-width="1.5"/><rect x="1" y="6" width="10" height="7.5" rx="1.5" fill="#1f2328"/><circle cx="6" cy="9.2" r="1.3" fill="#ffffff"/><rect x="5.5" y="9.4" width="1" height="2.5" fill="#ffffff"/></symbol>
<g id="bone"><rect x="-30" y="-3.5" width="60" height="7" rx="3.5"/><circle cx="-30" cy="-3.5" r="4.2"/><circle cx="-30" cy="3.5" r="4.2"/><circle cx="30" cy="-3.5" r="4.2"/><circle cx="30" cy="3.5" r="4.2"/></g></defs>
