<text x="742" y="547" font-size="8.8" fill="#5f6368">sysstate: network / power</text>
<text x="742" y="562" font-size="8.8" fill="#5f6368">portals: background / shortcuts</text>
<text x="742" y="577" font-size="8.8" fill="#5f6368">desktopnotify · clipboard</text>
<text x="742" y="592" font-size="8.8" fill="#5f6368">Gtk.UriLauncher · textemoji</text>
<rect x="728" y="624" width="252" height="196" rx="8" fill="#ffffff" stroke="#a15c00"/>
<text x="742" y="644" font-size="11.5" font-weight="600" fill="#a15c00">Import cycles, recounted</text>
<text x="742" y="662" font-size="8.8" fill="#5f6368">AST over every import, function bodies too:</text>
<text x="742" y="676" font-size="8.8" fill="#5f6368">one group of 81 of 153 modules</text>
<text x="742" y="690" font-size="8.8" fill="#5f6368">(main: 87 of 145), 390 edges inside.</text>
<text x="742" y="708" font-size="8.8" fill="#5f6368">At load time: none (module boundary R9).</text>
<text x="742" y="722" font-size="8.8" fill="#5f6368">Toolkit → plugin / webcolumn edges: 0 (R10).</text>
<text x="742" y="740" font-size="8.8" fill="#5f6368">Still tying the group, 8 lazy edges:</text>
<text x="742" y="752" font-size="8.8" fill="#5f6368">pagenav → profile, thread, timelinedata;</text>
<text x="742" y="764" font-size="8.8" fill="#5f6368">linkrouting → hashtags, blueskycard,</text>
<text x="742" y="776" font-size="8.8" fill="#5f6368">fedicollections, textemoji, bskytext.</text>
<text x="742" y="788" font-size="8.8" fill="#5f6368">Cut those 8 and it splits into 32, 4, 3, 3, 3.</text>
<text x="742" y="806" font-size="8.8" fill="#5f6368">Declared window.py exception: 1,820 lines.</text>
