<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 832" role="img" aria-labelledby="title desc">
<title id="title">Babble system architecture</title>
<desc id="desc">Layered architecture: application shell, feature views, the shared page toolkit split into small modules (pages.py marked as paging and state only), domain models, API registry and transport, external boundary, with media, state, plugin and system sidecars. Lock icons mark the boundaries a named test enforces. A box recounts the import cycles.</desc>
