name: CI

# The suite is the gate. Every test -- the meson tests and the
# desktop/metainfo/gschema/catalogue validators -- runs on every push
# and pull request.
#
# The build runs in a Fedora rawhide container because the project needs
# GTK >= 4.24 and libadwaita >= 1.10 (GNOME 51). No Ubuntu image carries
# those: ubuntu-latest ships GTK 4.14, and Canonical's repositories have
# nothing newer. The widget tests need a display, so the run is under
# Xvfb, and a session bus, because the keyring tests talk to D-Bus.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      # GNOME 51, matching what the app targets. Pinned to rawhide
      # rather than a release tag because there is no released image
      # carrying GTK 4.24 yet.
      image: docker.io/library/fedora:rawhide

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo -E dnf install -y \
            gtk4-devel libadwaita-devel libsoup3-devel libsecret-devel \
            python3-gobject gobject-introspection \
            meson ninja-build gettext desktop-file-utils appstream \
            glib2-devel \
            gtksourceview5-devel libspelling-devel hunspell-en-US \
            xorg-x11-server-Xvfb mesa-libGLES libglvnd-devel \
            dbus-daemon dbus-x11
          # Secret needs a session bus to answer at all, and D-Bus
          # refuses to start without a machine id.
          [ -s /etc/machine-id ] || dbus-uuidgen > /etc/machine-id

      - name: Configure
        run: meson setup build

      - name: Compile
        run: meson compile -C build

      - name: Test
        # Serialized, deliberately. The widget suites share one Xvfb
        # display, and several of them pump the same main context; run
        # concurrently, they race against each other and flake on a
        # perfectly clean tree (roughly 1 run in 3). A condition-wait in
        # a test cannot cancel that, because the contention is between
        # tests, not inside one. Priced at about a minute of wall clock.
        # -j1 is meson's serial switch, not a retry knob: the run stays
        # honest, one test at a time.
        env:
          GDK_DEBUG: no-portals
          NO_AT_BRIDGE: 1
          GTK_A11Y: none
        run: |
          xvfb-run -a dbus-run-session -- \
            meson test -C build -j1 --print-errorlogs 2>&1 | tee ci.log

      - name: Check the suite ran
        # A test that exits 77 is skipped, and meson still exits 0, so a
        # machine that cannot run part of the suite would report green.
        #
        # meson always prints a "Skipped:" line, with a count of 0 on a
        # clean run, so matching the line alone would fail every green
        # run. Parse the count instead, and allow exactly the skips this
        # environment forces -- `streaming helpers` needs a secret
        # service, and a container has none. A skip outside that set is
        # a real loss of coverage and fails.
        run: |
          skipped=$(sed -nE 's/^Skipped:[[:space:]]+([0-9]+).*/\1/p' ci.log | tail -1)
          skipped=${skipped:-0}
          unexpected=$(grep -E 'SKIP' ci.log \
            | grep -v 'streaming helpers' | grep -v 'no network' || true)
          if [ "$skipped" -ne 0 ] && [ -n "$unexpected" ]; then
            echo '::error::tests were skipped that this environment does not explain:'
            echo "$unexpected"
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::warning::$skipped test(s) skipped (expected: no secret service in a container)"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          # The whole repository, not just src/: bench/ is checked too.
          args: check .

  flatpak:
    name: Flatpak manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest parses
        # Cheapest possible rot check, and the one that needs no
        # network: a manifest that is not valid JSON fails here in a
        # second instead of after a ten-minute SDK download.
        run: |
          python3 -m json.tool \
            build-aux/flatpak/io.github.mauriciobc.Babble.json > /dev/null

      - name: Build against the GNOME 51 SDK
        # The manifest rot the meson suite cannot see: a renamed source
        # URL, a bumped tarball that moved, a module whose build options
        # no longer apply. This builds the whole thing, so the manifest
        # cannot go quietly stale between releases.
        #
        # The 51 SDK comes from Flathub, not from the nightly remote: it
        # is listed there and the nightly remote answers GPG verification
        # with "no summary found" when it is added from a bare URL, which
        # reads as an SDK problem that is not one.
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y \
            org.gnome.Sdk//51 org.gnome.Platform//51
          # rofiles-fuse is unavailable in the runner's kernel namespace;
          # without this every app install step hangs on it.
          flatpak-builder --user --force-clean \
            --disable-rofiles-fuse \
            build-flatpak \
            build-aux/flatpak/io.github.mauriciobc.Babble.json

      - name: Lint the bundle
        # The build step only proves the manifest builds. This is what
        # says the artifact is shippable: the same linter Flathub runs
        # on a submission, twice over. The `manifest` check reads the
        # manifest itself; the `builddir` check reads the tree
        # flatpak-builder left behind -- the metainfo, the desktop file,
        # the finish-args, the icons and the permissions as they were
        # actually installed, not as the manifest merely declares them.
        # Those are its four targets: appstream, manifest, builddir,
        # repo. There is no appdir, and builddir wants the build
        # directory itself, not the files/ inside it.
        #
        # --gha-format on both: these run as GitHub Actions steps, so
        # the findings arrive as annotations on the diff instead of
        # scrollback nobody reads.
        #
        # If the manifest check ever reports an error that only
        # Flathub's own linter can grant an exception for, --exceptions
        # is the flag that points at an exceptions.json. Not here: this
        # manifest is for local development, not a Flathub submission.
        #
        # Run through the org.flatpak.Builder flatpak rather than a
        # distro package: the linter is only as current as the Builder
        # it ships in, and the builder's version is what Flathub will
        # read it with. The flathub remote is already added by the build
        # step above, which is why this only installs.
        #
        # Unverified locally: flatpak-builder-lint is not installed on
        # a development machine, so this step's first real run is CI's.
        # A wrong tool invocation fails loudly here rather than passing
        # quietly.
        run: |
          flatpak install --user -y flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --gha-format manifest build-aux/flatpak/io.github.mauriciobc.Babble.json
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            --gha-format builddir build-flatpak

      - name: Report where the build landed
        # Not an assertion, just the artifact the run would be judged
        # from: the installed tree under /app.
        run: ls -1 build-flatpak/files/bin build-flatpak/files/share